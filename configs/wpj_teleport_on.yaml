# Teleport-Muon round 2, arm ON (litreview j §6 item 4; gate GO with +21-23%
# nuclear-norm headroom, reports/wpj-mech-round1.md §1). Every 25 steps from
# step 10: closed-form nuclear-norm ascent on the conv->BN gradient matrices,
# orbit move on the weights, gauge transport of grad + Muon momentum. The
# question this arm answers vs the OFF arm: does repeatedly holding ~+20%
# one-step descent potential compound into faster convergence / higher final
# accuracy, or does the landscape reabsorb it (as it did every intervention
# on the oscillation channel)?
# Dev-seed measurement run; never a comparison-table entry.
# Launch: uv run python scripts/sweep.py configs/wpj_teleport_on.yaml
experiment: airbench_teleport
seed: 3001
device: cuda

data:
  root: data/cifar10

train:
  epochs: 8
  batch_size: 2000

recipe:
  compile: true
  tta_level: 2

teleport:
  enabled: true
  every: 25
  start_step: 10
  spread: 2.0
  ascend_iters: 20
  step_size: 0.3

sweep:
  seeds:
    policy: dev
    num_seeds: 20
