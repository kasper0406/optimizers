# reports/channel-audit-preregistration.md §3 registers THIS run set: the same
# five config filenames, seeds 1300-1302 / 1310-1311 / 1320-1321, the ladder
# {0.12, 0.24, 0.48}, frozen_probes {enabled: true, k3: 64, max_lag: 32,
# decimate: 1}, and three riders b500/b2000/b8000 at 2 seeds each.  That
# agreement is mechanical, not a claim on trust: it is checks 4 and 5 of
