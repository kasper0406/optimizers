# Channel audit — frozen-tier RE-RUN, LR ladder (3 rungs x 2 dev seeds).
#
# STATUS: reports/channel-audit-preregistration.md §3 registers this run set
# (checked mechanically by scripts/preflight_channel_audit.py), but that
# document still reads "DRAFT -- not registered" and its Appendix
# threshold-freeze table is empty, which blocks the launch until a human
# freezes it.  The full status is in the header of
# configs/dev/instrumented_airbench_demod.yaml; read it before launching.
#
# Companion to configs/dev/instrumented_airbench_demod.yaml; that file's header
# carries the scientific rationale and the full list of instrumentation deltas.
# This file changes NOTHING except adding the probe_overrides.lr grid, exactly
# as configs/dev/instrumented_airbench_smoothness_lr_ladder.yaml did relative
# to its own base config.
#
# ---------------------------------------------------------------------------
# RUNG SET — VERIFIED AGAINST THE ORIGINAL STUDY, NOT ASSUMED.
#
# reports/frozen-probes.json lists the 9 runs behind the published frozen
# tier.  Their results JSONs pin the rungs:
#
#   seeds 1300-1302  -> configs/dev/instrumented_airbench_smoothness.yaml,
#                       no probe_overrides, i.e. the stock record lr 0.24
#                       (src.optim.airbench_zoo.AIRBENCH_STOCK_LR)
#   seed 1310        -> probe_overrides.lr 0.12 / 0.24 / 0.48
#   seed 1311        -> probe_overrides.lr 0.12 / 0.24 / 0.48
#
# So the original ladder was {0.12, 0.24, 0.48} = {0.5x, 1x, 2x} the record
# lr, and it did NOT include 0.96.  This re-run reproduces that ladder exactly,
# so the re-measured frozen tier is rung-for-rung and seed-for-seed MATCHED to
# reports/frozen-probes.md -- matched in design, not bitwise: those runs were
# on an A6000 and these are on the 5090 under an fp16 recipe, and k3 = 64
# redraws the probes, so the comparison is distributional either way (see
# CAVEAT ON THE GPU in the base config).
#
# KNOWN COVERAGE GAP, recorded rather than silently patched.  The DC-channel
# excess that motivated this audit was read off the 218 tracked-direction
# sidecars already on disk, which span lr 0.06-1.44 (frontier ladders), and it
# peaked at lr = 0.96.  No frozen-probe run has ever been done at lr = 0.96 --
# every 0.96 sidecar on disk comes from a frontier config with
# frozen_probes disabled.  This ladder therefore re-measures the frozen tier
# only over 0.12-0.48, i.e. it does NOT reach the lr where the peeked DC
# excess is largest.  Extending it is a one-line grid change (+2 runs, ~3 min)
# and a deliberate scope decision, not an oversight; it is left to the human.
# ---------------------------------------------------------------------------
#
# LAUNCH PRECONDITION (WP1.2, CLAUDE.md): criteria/phase1_preregistration.md
# must exist; scripts/run.py enforces this for airbench_instrumented.  The
# whole gate -- that file, the pre-registration's status line, its
# threshold-freeze table, and config/pre-registration agreement -- is
#   uv run --no-sync python scripts/preflight_channel_audit.py
# which exits non-zero while any of them is unresolved.
#
# Launch (GPU box) -- full procedure in docs/channel-audit-gpu-runbook.md:
#   uv run --no-sync python scripts/sweep.py configs/dev/instrumented_airbench_demod_lr_ladder.yaml
#   bash sweeps/instrumented_airbench_demod_lr_ladder/run_all.sh
# (6 runs = 3 rungs x 2 seeds)

experiment: airbench_instrumented
seed: 1310
device: cuda

data:
  root: data/cifar10

train:
  epochs: 8
  batch_size: 2000

recipe:
  tta_level: 2
  compile: false

probe_overrides:
  lr: 0.24             # overridden per rung by the sweep grid below

instrumentation:
  k1: 16
  k2: 16
  t_refresh: 50
  subspace_iters: 2
  betas: [0.9, 0.99]
  align_min: 0.9
  snapshot_every: 5
  seed: 4242
  min_dim: 8
  momentum_key: momentum_buffer
  hvp: false           # CHANGED (was true)
  smoothness:
    enabled: false     # CHANGED (was true)
  frozen_probes:
    enabled: true
    k3: 64             # CHANGED (was 16)
    max_lag: 32        # CHANGED (was 8); Newey-West caveat in the base config
    decimate: 1
  classifier:
    tau_sig: 4.0
    tau_noise: 2.0
    rho_osc: 0.5
    n_min: 50
    z_reset: 6.0
    innov_needed: 2
    innov_window: 4

sweep:
  seeds: [1310, 1311]         # same 2 dev seeds as the original ladder
  grid:
    probe_overrides.lr: [0.12, 0.24, 0.48]   # 0.5x / 1x / 2x the record lr
